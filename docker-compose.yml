services:
  pronote-sandbox:
    build: .
    container_name: kroco-pronote-sandbox
    environment:
      FOSSNOTE_DATABASE_PATH: /data/database.db
      FOSSNOTE_SEED_ON_START: "1"
      FOSSNOTE_DISABLE_DEMO_DATA: "1"
    ports:
      - "${FOSSNOTE_PORT:-3001}:3000"
    volumes:
      - pronote-sandbox-data:/data
    restart: unless-stopped
    # Le backend Kroco valide l'URL Pronote (anti-SSRF) : il refuse les IP privées,
    # « localhost » et les suffixes internes (.internal, .local…). On rejoint donc le
    # réseau de Kroco pour être joignable sous un simple nom de conteneur, qui passe
    # le garde-fou sans l'affaiblir : http://kroco-pronote-sandbox:3000/fossnote/eleve.html
    networks:
      - default
      - kroco

volumes:
  pronote-sandbox-data:

networks:
  kroco:
    external: true
    name: krocoapp_default
